version: 2


models:

  # ---------------- SILVER ----------------
  - name: silver_customers
    description: "Cleansed customer data"
    columns:
      - name: customer_id
        tests: [not_null]
      - name: first_name
        tests: [not_null]
      - name: last_name
        tests: [not_null]

  - name: silver_order
    description: "Cleansed orders data"
    columns:
      - name: order_id
        tests: [not_null]
      - name: customer_id
        tests: [not_null]
      - name: order_date
        tests: [not_null]

  - name: silver_orderitem
    description: "Cleansed order items"
    columns:
      - name: order_item_id
        tests: [not_null]
      - name: order_id
        tests: [not_null]
      - name: product_id
        tests: [not_null]

  - name: silver_product
    description: "Cleansed product data"
    columns:
      - name: product_id
        tests: [not_null]
      - name: supplier_id
        tests: [not_null]

  - name: silver_supplier
    description: "Cleansed supplier data"
    columns:
      - name: supplier_id
        tests: [not_null]
      - name: company_name
        tests: [not_null]

  # ---------------- GOLD DIMENSIONS ----------------
  - name: dim_customer
    description: "Customer dimension"
    columns:
      - name: customer_id
        tests: [not_null, unique]

  - name: dim_product
    description: "Product dimension"
    columns:
      - name: product_id
        tests: [not_null, unique]
      - name: supplier_id
        tests:
          - relationships:
              to: ref('dim_supplier')
              field: supplier_id

  - name: dim_supplier
    description: "Supplier dimension"
    columns:
      - name: supplier_id
        tests: [not_null, unique]


  - name: dim_date
    description: "Date dimension table"
    columns:
      - name: date_key
        description: "Surrogate key for the date"
        tests:
          - not_null
          - unique

  # ---------------- GOLD FACT ----------------
  - name: fact_sales
    description: "Sales fact table with all foreign keys"
    columns:
      - name: order_id
        tests: [not_null]
      - name: customer_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_customer')
              field: customer_id
      - name: product_id
        tests:
          - relationships:
              to: ref('dim_product')
              field: product_id
      - name: supplier_id
        tests:
          - relationships:
              to: ref('dim_supplier')
              field: supplier_id

